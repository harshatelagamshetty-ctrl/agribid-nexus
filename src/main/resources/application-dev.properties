# Activate with: --spring.profiles.active=dev
# Loosens what's strict-by-default in application.properties, for
# faster local iteration against the docker-compose Postgres/Qdrant.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.agribid.nexus=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# H2 web console for local inspection — http://localhost:8080/h2-console
# Deliberately only enabled here, never in the shared application.properties
# or application-prod.properties: it's an unauthenticated DB browser by
# default and has no business existing outside local dev.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Verbose Swagger UI is fine in dev; consider disabling in prod entirely
springdoc.swagger-ui.enabled=true