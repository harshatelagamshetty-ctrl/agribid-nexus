# Activate with: --spring.profiles.active=prod
# Every secret below MUST come from real environment variables /
# secret manager injection — none of the application.properties
# defaults are acceptable outside local dev.
#
# HONEST CAVEAT: this project now runs on H2 in every environment,
# including this "prod" profile, per an explicit decision to drop
# Postgres entirely. File-based H2 (jdbc:h2:file:...) is durable and
# works for a single-instance deployment, but it does NOT support
# multiple application instances writing to the same database file
# concurrently the way a real client-server database does — if this
# ever needs to scale beyond one instance, that's the point where H2
# stops being appropriate and a real server-based database (Postgres,
# MySQL, etc.) becomes necessary again.

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Defense in depth: H2 console is only ever enabled in
# application-dev.properties, but explicitly disabling it here too
# means a misconfigured or missing --spring.profiles.active can never
# accidentally leave it reachable.
spring.h2.console.enabled=false

# Qdrant collection should already exist by the time prod boots —
# don't implicitly create/alter schema on every deploy.
spring.ai.vectorstore.qdrant.initialize-schema=false

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

logging.level.com.agribid.nexus=WARN
logging.level.org.springframework.ai=WARN

management.endpoints.web.exposure.include=health