# This test uses @SpringBootTest, which constructs the FULL application
# context — including every ChatClient bean in SpringAiConfig — even
# though BidServiceConcurrencyTest never actually calls Gemini. A
# syntactically valid (but fake) API key is enough for those beans to
# construct successfully at context-startup; the test only exercises
# BidServiceImpl, which has no AI dependency at all.
spring.ai.google.genai.api-key=test-fake-key-not-a-real-credential

# H2 in-memory, following the project-wide move off Postgres.
# DB_CLOSE_DELAY=-1 keeps the in-memory database alive for the full
# JVM lifetime instead of being destroyed the instant the last
# connection closes — without it, Hibernate/Flyway's own connection
# churn between statements could wipe the schema mid-test.
#
# NOTE for later: this URL is shared across the whole test run. With
# only one test class today that's fine, but if more @SpringBootTest
# classes are added later that also write data, they'll share this
# same in-memory database unless each test class either uses a unique
# database name or is annotated @DirtiesContext to force a fresh
# Spring context (and therefore a fresh H2 instance) per class.
spring.datasource.url=jdbc:h2:mem:agribid_nexus_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

agribid.jwt.secret=test-only-secret-at-least-64-bytes-long-0123456789-abcdefghijklmno
agribid.jwt.expiration-ms=3600000
agribid.storage.base-path=./test-uploads

# Point Qdrant at a value that resolves cleanly even though this
# particular test never touches the vector store — avoids a startup
# failure from an unresolvable property.
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=agribid-test-context
spring.ai.vectorstore.qdrant.initialize-schema=false