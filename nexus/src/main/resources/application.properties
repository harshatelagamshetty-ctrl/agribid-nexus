spring.application.name=agribid-nexus

# ============================================================
# Database (H2, file-based — persists to ./data/agribid_nexus.mv.db
# on disk, unlike an in-memory H2 URL which wipes on every restart)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/agribid_nexus;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.ai.chat.memory.repository.jdbc.initialize-schema=always




# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# spring-ai-starter-model-chat-memory-repository-jdbc auto-creates its
# own ai_chat_memory table via its bundled schema script — deliberately
# NOT one of our V*__*.sql migrations, since it's Spring AI's schema to
# own/version, not ours.

# ============================================================
# JWT (consumed by security/JwtTokenProvider and config/JwtProperties)
# ============================================================
# CHANGE THIS before any real deployment — must be at least 64 bytes
# for HS512 (Keys.hmacShaKeyFor throws a WeakKeyException at startup
# otherwise, which is the correct fail-fast behavior for a short secret).
agribid.jwt.secret=${JWT_SECRET:this-is-a-development-only-secret-replace-me-before-deploying-anywhere-real-0123456789}
agribid.jwt.expiration-ms=86400000

# ============================================================
# File storage (util/FileStorageUtil)
# ============================================================
agribid.storage.base-path=./uploads

# ============================================================
# Scheduler (scheduler/AuctionCloseScheduler)
# ============================================================
agribid.scheduler.auction-close-check-rate-ms=30000

# ============================================================
# Pagination (see the pagination-defaults discussion — this closes
# the gap where getMyLots()/getFulfillments() previously relied on
# Spring Data's own implicit max-page-size=2000)
# ============================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ============================================================
# Spring AI: Gemini (Google GenAI)
# ============================================================
spring.ai.google.genai.api-key={GEMINI_API_KEY}

spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.temperature=0.2

# Embeddings use the same api-key above (Gemini Developer API mode) —
# this is a SEPARATE model/config namespace from chat, backed by the
# spring-ai-starter-model-google-genai-embedding dependency. Without
# this, QdrantVectorStoreAutoConfiguration has no EmbeddingModel bean
# to inject and fails at startup.
# Embeddings use a SEPARATE api-key property from chat — they do not
# automatically inherit spring.ai.google.genai.api-key above, since
# embeddings have their own connection-details namespace. Without
# this explicit key, Spring AI's auto-configuration defaults to
# Vertex AI mode (which requires a GCP project-id) instead of the
# simple Gemini Developer API key mode chat already uses.
spring.ai.google.genai.embedding.api-key={GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=
# ============================================================
# Spring AI: Qdrant vector store (RAG)
# ============================================================
# host is 127.0.0.1, NOT localhost — Windows/Docker Desktop resolves
# "localhost" to the IPv6 loopback (::1) first, which Docker Desktop's
# port forwarding does not reliably cover, producing a misleading
# "Connection refused" even when the Qdrant container is healthy and
# running. Forcing IPv4 explicitly sidesteps the ambiguity entirely.
spring.ai.vectorstore.qdrant.host=127.0.0.1
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=agribid-market-context
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.initialize-schema=true

# ============================================================
# Spring AI: MCP server (this app exposing warehouse-inventory /
# contract-terms to external logistics-partner agents)
# ============================================================
spring.ai.mcp.server.name=agribid-nexus
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=2

# ============================================================
# Spring AI: MCP client (this app consuming the external
# Weather-Risk MCP server — see ai/mcp/client/WeatherRiskMcpClientNotes)
# ============================================================
spring.ai.mcp.client.toolcallback.enabled=true
# Uncomment and point at a real weather-risk service to enable it.
# With this commented out, ToolCallbackProvider still auto-configures
# with zero remote tools rather than failing startup.
# spring.ai.mcp.client.streamable-http.connections.weather-risk.url=http://weather-risk-service:8081/mcp

# ============================================================
# Springdoc / Swagger
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info

# ============================================================
# Logging
# ============================================================
logging.level.com.agribid.nexus=INFO
logging.level.org.springframework.ai=INFO
# ============================================================
# CORS — must match your actual frontend's real origin, not
# guessed/copy-pasted dev-server ports (see SecurityConfig)
# ============================================================
agribid.cors.allowed-origins=http://localhost:3000

# ============================================================
# Multipart upload limits — raised from Spring Boot's 1MB default
# specifically for video-grading uploads (see attachVideo)
# ============================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB