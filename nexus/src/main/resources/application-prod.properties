# ============================================================
# PostgreSQL - Render
# ============================================================
# Render's Postgres "Connect" tab gives you host/port/database/user/password
# separately. Building the JDBC URL from those five avoids the jdbc:${DATABASE_URL}
# bug — Render's combined URL starts with "postgres://", not "postgresql://",
# so jdbc:${DATABASE_URL} produces an invalid driver scheme and fails at boot.
#
# CRITICAL: these lines were previously commented out, which meant the
# "prod" profile silently fell back to the BASE application.properties'
# local H2 file datasource — the exact single-instance, ephemeral-filesystem
# database explicitly documented as unsafe for real deployment. Any actual
# Render deploy run against the commented-out version would have been
# writing to a local H2 file inside the container, not Postgres at all.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# H2
# ============================================================
spring.h2.console.enabled=false

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# JWT
# ============================================================
agribid.jwt.secret=${JWT_SECRET}
agribid.jwt.expiration-ms=86400000

# ============================================================
# File Storage
# ============================================================
# NOTE: Render's free web service disk is ephemeral — anything written here
# is lost on every restart/redeploy. Fine for a first deploy; move to S3/R2
# before you rely on persisted uploads.
agribid.storage.base-path=./uploads

# ============================================================
# Scheduler
# ============================================================
agribid.scheduler.auction-close-check-rate-ms=30000

# ============================================================
# Pagination
# ============================================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ============================================================
# Spring AI - Gemini
# ============================================================
spring.ai.google.genai.api-key={GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.temperature=0.2

# Gemini Embeddings
spring.ai.google.genai.embedding.api-key={GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=

# ============================================================
# Qdrant
# ============================================================
# ============================================================
# Qdrant
# ============================================================
# Same "was commented out entirely" bug as the datasource above.
# Points at env vars for Qdrant Cloud (or any managed Qdrant), not
# localhost/127.0.0.1 — those only resolve to something useful on
# your own machine, never inside a deployed container.
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=agribid-market-context
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
spring.ai.vectorstore.qdrant.use-tls=true
spring.ai.vectorstore.qdrant.initialize-schema=true

# ============================================================
# Spring AI - MCP Server
# ============================================================
spring.ai.mcp.server.name=agribid-nexus
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# ============================================================
# Spring AI - Retry
# ============================================================
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=2

# ============================================================
# Spring AI - MCP Client
# ============================================================
spring.ai.mcp.client.toolcallback.enabled=true

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health

# ============================================================
# CORS — set to your real deployed frontend URL (e.g. Vercel),
# not a placeholder. Judges testing your live URL will hit CORS
# failures if this doesn't match exactly, protocol included.
# ============================================================
agribid.cors.allowed-origins=${FRONTEND_URL}

# ============================================================
# Logging
# ============================================================
logging.level.com.agribid.nexus=WARN
logging.level.org.springframework.ai=WARN